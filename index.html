<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Chord Metronome</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .container {
            text-align: center;
            background: #2b2b36;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.5rem;
            color: #a9b0c0;
        }

        .top-controls {
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 70px;
            padding: 10px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: none;
            text-align: center;
            background: #444455;
            color: white;
            outline: none;
            font-weight: bold;
        }

        .measure-indicator {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .beat-dot {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #444455;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #888;
            transition: background-color 0.05s ease, box-shadow 0.05s ease;
        }

        .beat-dot.active-accent {
            background-color: #4facfe;
            color: #1e1e24;
            box-shadow: 0 0 20px #4facfe;
        }

        .beat-dot.active {
            background-color: #00ff88;
            color: #1e1e24;
            box-shadow: 0 0 20px #00ff88;
        }

        .beat-dot.active-prep {
            background-color: #ffaa00;
            color: #1e1e24;
            box-shadow: 0 0 20px #ffaa00;
        }

        .chord-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            margin: 10px 0 20px 0;
        }

        #chordDisplay {
            font-size: 6rem;
            font-weight: bold;
            min-width: 150px;
            height: 140px;
            line-height: 140px;
            color: #ffffff;
            transition: color 0.1s;
        }

        #chordDiagram {
            width: 130px;
            height: 160px;
        }

        #chordDiagram svg { width: 100%; height: 100%; }

        /* --- Chord detection panel --- */
        .detect-panel {
            background: #1e1e24;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        button#micBtn {
            background: #444455;
            color: #ffffff;
            border: none;
            padding: 8px 20px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button#micBtn.listening { background: #00aa66; }

        .detect-body { display: none; margin-top: 12px; }
        .detect-body.show { display: block; }

        .detect-label { color: #a9b0c0; font-size: 0.9rem; }

        #detectedChord {
            font-size: 2.6rem;
            font-weight: bold;
            height: 56px;
            line-height: 56px;
            color: #888;
            transition: color 0.15s;
        }
        #detectedChord.match { color: #00ff88; }
        #detectedChord.miss  { color: #ff4b4b; }

        #detectVerdict { height: 22px; font-size: 1rem; font-weight: bold; }
        #detectVerdict.match { color: #00ff88; }
        #detectVerdict.miss  { color: #ff4b4b; }

        .level-meter {
            position: relative;
            height: 8px;
            background: #444455;
            border-radius: 4px;
            margin: 10px auto 6px auto;
            max-width: 260px;
            overflow: hidden;
        }
        #levelFill {
            height: 100%;
            width: 0%;
            background: #4facfe;
            transition: width 0.08s linear;
        }
        #levelThreshold {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #ffaa00;
        }

        #scoreDisplay { color: #a9b0c0; font-size: 0.95rem; margin-top: 6px; }

        input[type="range"] { accent-color: #4facfe; cursor: pointer; }

        button#startStopBtn {
            background: #4facfe;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 20px;
        }

        button#startStopBtn:active {
            transform: scale(0.95);
        }

        button#startStopBtn.playing {
            background: #ff4b4b;
        }

        button#settingsToggleBtn {
            background: transparent;
            color: #a9b0c0;
            border: 1px solid #444455;
            padding: 8px 20px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            margin-top: 10px;
        }

        button#settingsToggleBtn:hover {
            background: #444455;
            color: #ffffff;
        }

        .settings-panel {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.4s ease, margin-top 0.4s ease;
            background: #1e1e24;
            border-radius: 10px;
        }

        .settings-panel.open {
            max-height: 800px;
            opacity: 1;
            margin-top: 20px;
            padding: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .settings-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2b2b36;
            padding: 8px 15px;
            border-radius: 8px;
        }

        select {
            padding: 6px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            background: #444455;
            color: white;
            outline: none;
            cursor: pointer;
        }

        input[type="checkbox"]#voiceToggle {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4facfe;
        }

        .chord-settings h3 {
            margin: 0 0 15px 0;
            font-size: 1rem;
            color: #a9b0c0;
        }

        .chord-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .chord-label {
            cursor: pointer;
            user-select: none;
        }

        .chord-label input {
            display: none;
        }

        .chord-pill {
            display: inline-block;
            padding: 6px 12px;
            background: #444455;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .chord-label input:checked + .chord-pill {
            background: #4facfe;
            color: #1e1e24;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chord Practice Metronome</h1>
        
        <div class="top-controls">
            <label for="bpm">BPM:</label>
            <input type="number" id="bpm" value="50" min="10" max="240">
        </div>

        <div class="measure-indicator">
            <div class="beat-dot" id="dot-0">1</div>
            <div class="beat-dot" id="dot-1">2</div>
            <div class="beat-dot" id="dot-2">3</div>
            <div class="beat-dot" id="dot-3">4</div>
        </div>

        <div class="chord-row">
            <div id="chordDisplay">-</div>
            <div id="chordDiagram"></div>
        </div>

        <div class="detect-panel">
            <button id="micBtn">🎤 Enable Chord Detection</button>
            <div class="detect-body" id="detectBody">
                <div class="detect-label">You played:</div>
                <div id="detectedChord">—</div>
                <div id="detectVerdict"></div>
                <div class="level-meter">
                    <div id="levelFill"></div>
                    <div id="levelThreshold"></div>
                </div>
                <div id="scoreDisplay"></div>
            </div>
        </div>

        <button id="startStopBtn">START</button>
        <br>
        <button id="settingsToggleBtn">⚙️ Settings</button>

        <div class="settings-panel" id="settingsPanel">
            
            <div class="settings-controls">
                <div class="control-group">
                    <label for="soundSelect">Sound:</label>
                    <select id="soundSelect">
                        <option value="beep">Electronic Beep</option>
                        <option value="woodblock">Woodblock</option>
                        <option value="rock">Rock Drum Kit</option>
                        <option value="blues">Texas Blues Stomp</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="voiceToggle" style="cursor: pointer;">Voice Announce:</label>
                    <input type="checkbox" id="voiceToggle">
                </div>
                <div class="control-group">
                    <label for="sensitivity">Mic Sensitivity:</label>
                    <input type="range" id="sensitivity" min="1" max="100" value="60">
                </div>
                <div class="control-group">
                    <label for="headphonesToggle" style="cursor: pointer;" title="Turn on if the metronome is playing through headphones, so the mic can listen continuously">Using Headphones:</label>
                    <input type="checkbox" id="headphonesToggle">
                </div>
            </div>

            <div class="chord-settings">
                <h3>Select Practice Chords</h3>
                <div class="chord-grid" id="chordGrid"></div>
            </div>

        </div>
    </div>

    <script>
        const masterChords = [
            'A', 'Am', 'B', 'Bm', 'C', 'Cm', 'D', 'Dm', 'E', 'Em', 'F', 'Fm', 'G', 'Gm'
        ];
        
        const chordPronunciations = {
            'A': 'A', 'Am': 'A minor', 'B': 'B', 'Bm': 'B minor',
            'C': 'C', 'Cm': 'C minor', 'D': 'D', 'Dm': 'D minor',
            'E': 'E', 'Em': 'E minor', 'F': 'F', 'Fm': 'F minor',
            'G': 'G', 'Gm': 'G minor'
        };

        const defaultChords = ['C', 'A', 'G', 'E', 'D', 'Em'];

        // --- CHORD SHAPES (strings low E → high e; -1 = muted, 0 = open) ---
        const chordShapes = {
            'A':  { frets: [-1,0,2,2,2,0],  fingers: [0,0,1,2,3,0], base: 1 },
            'Am': { frets: [-1,0,2,2,1,0],  fingers: [0,0,2,3,1,0], base: 1 },
            'B':  { frets: [-1,2,4,4,4,2],  fingers: [0,1,3,3,3,1], base: 1, barre: { fret: 2, from: 1, to: 5 } },
            'Bm': { frets: [-1,2,4,4,3,2],  fingers: [0,1,3,4,2,1], base: 1, barre: { fret: 2, from: 1, to: 5 } },
            'C':  { frets: [-1,3,2,0,1,0],  fingers: [0,3,2,0,1,0], base: 1 },
            'Cm': { frets: [-1,3,5,5,4,3],  fingers: [0,1,3,4,2,1], base: 3, barre: { fret: 3, from: 1, to: 5 } },
            'D':  { frets: [-1,-1,0,2,3,2], fingers: [0,0,0,1,3,2], base: 1 },
            'Dm': { frets: [-1,-1,0,2,3,1], fingers: [0,0,0,2,3,1], base: 1 },
            'E':  { frets: [0,2,2,1,0,0],   fingers: [0,2,3,1,0,0], base: 1 },
            'Em': { frets: [0,2,2,0,0,0],   fingers: [0,2,3,0,0,0], base: 1 },
            'F':  { frets: [1,3,3,2,1,1],   fingers: [1,3,4,2,1,1], base: 1, barre: { fret: 1, from: 0, to: 5 } },
            'Fm': { frets: [1,3,3,1,1,1],   fingers: [1,3,4,1,1,1], base: 1, barre: { fret: 1, from: 0, to: 5 } },
            'G':  { frets: [3,2,0,0,0,3],   fingers: [2,1,0,0,0,3], base: 1 },
            'Gm': { frets: [3,5,5,3,3,3],   fingers: [1,3,4,1,1,1], base: 3, barre: { fret: 3, from: 0, to: 5 } }
        };

        function renderChordDiagram(chord) {
            const el = document.getElementById('chordDiagram');
            const shape = chordShapes[chord];
            if (!shape) { el.innerHTML = ''; return; }

            const left = 34, top = 30, sGap = 18, fGap = 24, nFrets = 5;
            const right = left + sGap * 5, bottom = top + fGap * nFrets;
            const x = s => left + s * sGap;
            const y = f => top + (f - shape.base + 0.5) * fGap;
            let svg = `<svg viewBox="0 0 140 165" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">`;

            // Frets & nut
            for (let f = 0; f <= nFrets; f++) {
                const w = (f === 0 && shape.base === 1) ? 5 : 1.5;
                svg += `<line x1="${left}" y1="${top + f * fGap}" x2="${right}" y2="${top + f * fGap}" stroke="#a9b0c0" stroke-width="${w}"/>`;
            }
            if (shape.base > 1) {
                svg += `<text x="2" y="${top + fGap * 0.5 + 4}" fill="#a9b0c0" font-size="11">${shape.base}fr</text>`;
            }
            // Strings
            for (let s = 0; s < 6; s++) {
                svg += `<line x1="${x(s)}" y1="${top}" x2="${x(s)}" y2="${bottom}" stroke="#a9b0c0" stroke-width="1.5"/>`;
            }
            // Open / muted markers
            shape.frets.forEach((f, s) => {
                if (f === 0) svg += `<circle cx="${x(s)}" cy="${top - 12}" r="5" fill="none" stroke="#ffffff" stroke-width="1.5"/>`;
                if (f === -1) svg += `<text x="${x(s)}" y="${top - 7}" fill="#ff4b4b" font-size="14" font-weight="bold" text-anchor="middle">×</text>`;
            });
            // Barre
            if (shape.barre) {
                const b = shape.barre;
                svg += `<rect x="${x(b.from) - 8}" y="${y(b.fret) - 8}" width="${x(b.to) - x(b.from) + 16}" height="16" rx="8" fill="#4facfe"/>`;
                svg += `<text x="${(x(b.from) + x(b.to)) / 2}" y="${y(b.fret) + 4.5}" fill="#1e1e24" font-size="12" font-weight="bold" text-anchor="middle">1</text>`;
            }
            // Finger dots
            shape.frets.forEach((f, s) => {
                if (f <= 0) return;
                if (shape.barre && f === shape.barre.fret && s >= shape.barre.from && s <= shape.barre.to) return;
                svg += `<circle cx="${x(s)}" cy="${y(f)}" r="8" fill="#4facfe"/>`;
                if (shape.fingers[s]) {
                    svg += `<text x="${x(s)}" y="${y(f) + 4.5}" fill="#1e1e24" font-size="12" font-weight="bold" text-anchor="middle">${shape.fingers[s]}</text>`;
                }
            });
            svg += `</svg>`;
            el.innerHTML = svg;
        }
        let activeChords = [];

        let isPlaying = false;
        let timerID;
        let audioCtx;
        let noiseBuffer; 
        let currentBeat = 0; 
        const beatsPerMeasure = 4;

        const bpmInput = document.getElementById('bpm');
        const soundSelect = document.getElementById('soundSelect');
        const voiceToggle = document.getElementById('voiceToggle');
        const startStopBtn = document.getElementById('startStopBtn');
        const chordDisplay = document.getElementById('chordDisplay');
        const chordGrid = document.getElementById('chordGrid');
        
        const settingsToggleBtn = document.getElementById('settingsToggleBtn');
        const settingsPanel = document.getElementById('settingsPanel');

        settingsToggleBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('open');
            if (settingsPanel.classList.contains('open')) {
                settingsToggleBtn.innerText = '⚙️ Close Settings';
            } else {
                settingsToggleBtn.innerText = '⚙️ Settings';
            }
        });

        function initializePreferences() {
            const savedChords = localStorage.getItem('metronomeChords');
            if (savedChords) {
                activeChords = JSON.parse(savedChords);
            } else {
                activeChords = [...defaultChords];
            }

            masterChords.forEach(chord => {
                const label = document.createElement('label');
                label.className = 'chord-label';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = chord;
                checkbox.checked = activeChords.includes(chord);
                
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        activeChords.push(chord);
                    } else {
                        activeChords = activeChords.filter(c => c !== chord);
                    }
                    localStorage.setItem('metronomeChords', JSON.stringify(activeChords));
                    if (activeChords.length === 0) chordDisplay.innerText = '-';
                });

                const pill = document.createElement('span');
                pill.className = 'chord-pill';
                pill.innerText = chord;

                label.appendChild(checkbox);
                label.appendChild(pill);
                chordGrid.appendChild(label);
            });

            if (localStorage.getItem('metronomeSound')) {
                soundSelect.value = localStorage.getItem('metronomeSound');
            }
            soundSelect.addEventListener('change', (e) => {
                localStorage.setItem('metronomeSound', e.target.value);
            });

            const savedVoice = localStorage.getItem('metronomeVoice');
            if (savedVoice !== null) {
                voiceToggle.checked = savedVoice === 'true';
            } else {
                voiceToggle.checked = true; 
            }
            voiceToggle.addEventListener('change', (e) => {
                localStorage.setItem('metronomeVoice', e.target.checked);
            });

            const savedSens = localStorage.getItem('metronomeSensitivity');
            if (savedSens !== null) sensitivityInput.value = savedSens;
            sensitivityInput.addEventListener('input', (e) => {
                localStorage.setItem('metronomeSensitivity', e.target.value);
            });

            headphonesToggle.checked = localStorage.getItem('metronomeHeadphones') === 'true';
            headphonesToggle.addEventListener('change', (e) => {
                localStorage.setItem('metronomeHeadphones', e.target.checked);
            });
        }

        // --- DRUM SYNTHESIZER ENGINE ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const bufferSize = audioCtx.sampleRate * 2;
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playKick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain).connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.1);
            gain.gain.setValueAtTime(1.5, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            osc.start(time);
            osc.stop(time + 0.1);
        }

        function playSnare(time) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 1000;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(1, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
            noise.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);
            noise.start(time);
            
            const osc = audioCtx.createOscillator();
            osc.type = 'triangle';
            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0.5, time);
            oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            osc.frequency.setValueAtTime(250, time);
            osc.connect(oscGain).connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + 0.2);
        }

        function playHiHat(time) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;
            const bandpass = audioCtx.createBiquadFilter();
            bandpass.type = 'bandpass';
            bandpass.frequency.value = 10000;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.3, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
            noise.connect(bandpass).connect(gain).connect(audioCtx.destination);
            noise.start(time);
        }

        function playRide(time) {
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;
            const bandpass = audioCtx.createBiquadFilter();
            bandpass.type = 'bandpass';
            bandpass.frequency.value = 4500; 
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.4, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.7); 
            noise.connect(bandpass).connect(gain).connect(audioCtx.destination);
            noise.start(time);
        }

        // Standard Electronic Metronome Beep
        function playTone(time, freq) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain).connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, time);
            gain.gain.setValueAtTime(1, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            osc.start(time);
            osc.stop(time + 0.1);
        }

        // New Dedicated Woodblock Synthesizer
        function playWoodblock(time, isAccent) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain).connect(audioCtx.destination);
            
            // Square wave for a hollow, wooden sound
            osc.type = 'square'; 
            const startFreq = isAccent ? 1000 : 700;
            
            osc.frequency.setValueAtTime(startFreq, time);
            // Quick pitch bend downward to simulate the percussive strike
            osc.frequency.exponentialRampToValueAtTime(startFreq / 2, time + 0.03);
            
            // Very fast volume decay (0.03s) for a sharp "tick" instead of a lingering "beep"
            gain.gain.setValueAtTime(0.5, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
            
            osc.start(time);
            osc.stop(time + 0.05);
        }

        function triggerSoundForBeat(beatIndex) {
            initAudio();
            const t = audioCtx.currentTime;
            lastClickTime = t;
            const kit = soundSelect.value;
            const isAccent = (beatIndex === 0);

            if (kit === 'beep') {
                playTone(t, isAccent ? 1200 : 800);
            } 
            else if (kit === 'woodblock') {
                playWoodblock(t, isAccent); 
            }
            else if (kit === 'rock') {
                playHiHat(t); 
                if (beatIndex === 0 || beatIndex === 2) {
                    playKick(t);
                } else {
                    playSnare(t);
                }
            }
            else if (kit === 'blues') {
                playRide(t); 
                playKick(t); 
                if (beatIndex === 1 || beatIndex === 3) {
                    playSnare(t); 
                }
            }
        }

        // --- CHORD DETECTION ENGINE ---
        // Listens via the mic, builds a 12-note "chroma" profile from spectral peaks,
        // and matches it against harmonic-aware major/minor triad templates.
        const NOTE_NAMES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
        const NATURAL_PC = { 'C':0, 'D':2, 'E':4, 'F':5, 'G':7, 'A':9, 'B':11 };
        const FFT_SIZE = 16384;
        const MATCH_THRESHOLD = 0.82;   // minimum template similarity to report a chord
        const STABLE_FRAMES = 2;        // consecutive agreeing frames before display updates

        let micStream = null, micSource = null, analyser = null, detectTimer = null;
        let freqData, timeData;
        let smoothedChroma = new Float32Array(12);
        let lastClickTime = -10;
        let candidate = null, candidateCount = 0, lastHeardAt = 0;
        let playingChord = '';          // chord the player should be playing this measure
        let matchedThisMeasure = false;
        let score = { hits: 0, total: 0 };

        const micBtn = document.getElementById('micBtn');
        const detectBody = document.getElementById('detectBody');
        const detectedChordEl = document.getElementById('detectedChord');
        const detectVerdict = document.getElementById('detectVerdict');
        const levelFill = document.getElementById('levelFill');
        const levelThreshold = document.getElementById('levelThreshold');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const sensitivityInput = document.getElementById('sensitivity');
        const headphonesToggle = document.getElementById('headphonesToggle');

        const chordTemplates = (() => {
            const list = [];
            for (let root = 0; root < 12; root++) {
                for (const minor of [false, true]) {
                    const t = new Float32Array(12);
                    for (const iv of [0, minor ? 3 : 4, 7]) {
                        for (let h = 1; h <= 6; h++) {
                            t[(root + iv + Math.round(12 * Math.log2(h))) % 12] += Math.pow(0.6, h - 1);
                        }
                    }
                    normalize(t);
                    list.push({ root, minor, name: NOTE_NAMES[root] + (minor ? 'm' : ''), t });
                }
            }
            return list;
        })();

        function normalize(v) {
            let n = 0;
            for (let i = 0; i < v.length; i++) n += v[i] * v[i];
            n = Math.sqrt(n) || 1;
            for (let i = 0; i < v.length; i++) v[i] /= n;
            return v;
        }

        function rmsThreshold() {
            const s = parseInt(sensitivityInput.value) / 100;
            return 0.05 * Math.pow(1 - s, 2) + 0.001;
        }

        function chordMatchesTarget(det, target) {
            if (!det || !target) return false;
            const minor = target.endsWith('m');
            return det.root === NATURAL_PC[target.replace('m', '')] && det.minor === minor;
        }

        function computeChroma() {
            analyser.getFloatFrequencyData(freqData);
            const sr = audioCtx.sampleRate;
            const binHz = sr / FFT_SIZE;
            const kMin = Math.ceil(70 / binHz), kMax = Math.floor(2000 / binHz);
            let maxDb = -Infinity;
            for (let k = kMin; k <= kMax; k++) if (freqData[k] > maxDb) maxDb = freqData[k];
            const floor = Math.max(maxDb - 50, -100);
            const chroma = new Float32Array(12);
            for (let k = kMin; k <= kMax; k++) {
                const b = freqData[k];
                if (b < floor || b <= freqData[k - 1] || b < freqData[k + 1]) continue;
                // Parabolic interpolation for a more precise peak frequency
                const a = freqData[k - 1], g = freqData[k + 1];
                const denom = a - 2 * b + g;
                const p = denom !== 0 ? 0.5 * (a - g) / denom : 0;
                const freq = (k + p) * binHz;
                const pc = ((Math.round(69 + 12 * Math.log2(freq / 440)) % 12) + 12) % 12;
                chroma[pc] += Math.pow(10, b / 20);
            }
            return normalize(chroma);
        }

        function bestChord(chroma) {
            let best = null, bestScore = -1;
            for (const tpl of chordTemplates) {
                let s = 0;
                for (let i = 0; i < 12; i++) s += chroma[i] * tpl.t[i];
                if (s > bestScore) { bestScore = s; best = tpl; }
            }
            return { ...best, score: bestScore };
        }

        function showDetection(det) {
            detectedChordEl.classList.remove('match', 'miss');
            detectVerdict.classList.remove('match', 'miss');
            if (!det) {
                detectedChordEl.innerText = '—';
                detectVerdict.innerText = '';
                return;
            }
            detectedChordEl.innerText = det.name;
            if (isPlaying && playingChord) {
                if (chordMatchesTarget(det, playingChord)) {
                    detectedChordEl.classList.add('match');
                    detectVerdict.classList.add('match');
                    detectVerdict.innerText = '✓ Correct!';
                    matchedThisMeasure = true;
                } else {
                    detectedChordEl.classList.add('miss');
                    detectVerdict.classList.add('miss');
                    detectVerdict.innerText = `✗ Expected ${playingChord}`;
                }
            } else {
                detectVerdict.innerText = '';
            }
        }

        function updateScoreDisplay() {
            if (!micStream) { scoreDisplay.innerText = ''; return; }
            if (score.total === 0) { scoreDisplay.innerText = isPlaying ? 'Score: — ' : 'Free play: strum any chord'; return; }
            const pct = Math.round(100 * score.hits / score.total);
            scoreDisplay.innerText = `Score: ${score.hits} / ${score.total} measures (${pct}%)`;
        }

        function detectTick() {
            analyser.getFloatTimeDomainData(timeData);
            let sum = 0;
            for (let i = timeData.length - 4096; i < timeData.length; i++) sum += timeData[i] * timeData[i];
            const rms = Math.sqrt(sum / 4096);
            const thr = rmsThreshold();
            levelFill.style.width = Math.min(100, rms / 0.1 * 100) + '%';
            levelThreshold.style.left = Math.min(100, thr / 0.1 * 100) + '%';

            // Ignore frames contaminated by the metronome click or voice (unless on headphones)
            const windowSec = FFT_SIZE / audioCtx.sampleRate;
            const kit = soundSelect.value;
            const clickDecay = (kit === 'beep' || kit === 'woodblock') ? 0.12 : (kit === 'rock' ? 0.25 : 0.6);
            const gated = !headphonesToggle.checked && (
                (isPlaying && audioCtx.currentTime - lastClickTime < windowSec + clickDecay) ||
                window.speechSynthesis.speaking
            );

            if (rms < thr) {
                if (performance.now() - lastHeardAt > 1500) { showDetection(null); candidate = null; }
                return;
            }
            if (gated) return;
            lastHeardAt = performance.now();

            const chroma = computeChroma();
            for (let i = 0; i < 12; i++) smoothedChroma[i] = 0.5 * smoothedChroma[i] + 0.5 * chroma[i];
            const det = bestChord(normalize(Float32Array.from(smoothedChroma)));
            if (det.score < MATCH_THRESHOLD) return;

            if (candidate && candidate.name === det.name) {
                candidateCount++;
            } else {
                candidate = det;
                candidateCount = 1;
            }
            if (candidateCount >= STABLE_FRAMES) showDetection(det);
        }

        async function startMic() {
            initAudio();
            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });
            } catch (err) {
                alert('Could not access the microphone: ' + err.message +
                      '\n\nTip: browsers only allow mic access on https:// or http://localhost pages.');
                micStream = null;
                return;
            }
            micSource = audioCtx.createMediaStreamSource(micStream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = FFT_SIZE;
            analyser.smoothingTimeConstant = 0;
            micSource.connect(analyser);   // not connected to speakers — avoids feedback
            freqData = new Float32Array(analyser.frequencyBinCount);
            timeData = new Float32Array(FFT_SIZE);
            smoothedChroma = new Float32Array(12);
            detectTimer = setInterval(detectTick, 100);

            micBtn.innerText = '🎤 Listening… (click to stop)';
            micBtn.classList.add('listening');
            detectBody.classList.add('show');
            showDetection(null);
            updateScoreDisplay();
        }

        function stopMic() {
            clearInterval(detectTimer);
            if (micSource) micSource.disconnect();
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            micStream = micSource = analyser = null;
            micBtn.innerText = '🎤 Enable Chord Detection';
            micBtn.classList.remove('listening');
            detectBody.classList.remove('show');
        }

        micBtn.addEventListener('click', () => micStream ? stopMic() : startMic());

        // --- VISUAL & LOGIC ENGINE ---
        let lastChord = '';

        function updateChord() {
            if (activeChords.length === 0) {
                chordDisplay.innerText = '-';
                return;
            }
            
            let newChord;
            if (activeChords.length === 1) {
                newChord = activeChords[0];
            } else {
                do {
                    newChord = activeChords[Math.floor(Math.random() * activeChords.length)];
                } while (newChord === lastChord);
            }
            
            lastChord = newChord;
            chordDisplay.innerText = newChord;
            renderChordDiagram(newChord);

            if (voiceToggle.checked) {
                window.speechSynthesis.cancel(); 
                const spokenText = chordPronunciations[newChord] || newChord;
                const utterance = new SpeechSynthesisUtterance(spokenText);
                utterance.rate = 1.3; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function triggerBeat() {
            triggerSoundForBeat(currentBeat);

            for (let i = 0; i < beatsPerMeasure; i++) {
                document.getElementById(`dot-${i}`).classList.remove('active', 'active-accent', 'active-prep');
            }
            
            const activeDot = document.getElementById(`dot-${currentBeat}`);
            
            if (currentBeat === 0) {
                // New measure: score the one that just ended, then lock in the new target chord
                if (micStream && playingChord) {
                    score.total++;
                    if (matchedThisMeasure) score.hits++;
                    updateScoreDisplay();
                }
                playingChord = lastChord;
                matchedThisMeasure = false;
                if (micStream) showDetection(null);

                activeDot.classList.add('active-accent');
                chordDisplay.style.color = "#ffffff";     
            } else if (currentBeat === 3) {
                activeDot.classList.add('active-prep');   
                updateChord();                            
                chordDisplay.style.color = "#ffaa00";     
            } else {
                activeDot.classList.add('active');        
                chordDisplay.style.color = "#ffffff";     
            }

            currentBeat = (currentBeat + 1) % beatsPerMeasure;
        }

        function startMetronome() {
            initAudio();

            const bpm = parseInt(bpmInput.value);
            const intervalMs = (60 / bpm) * 1000;

            updateChord();

            playingChord = '';
            matchedThisMeasure = false;
            score = { hits: 0, total: 0 };

            currentBeat = 0;
            triggerBeat(); 
            timerID = setInterval(triggerBeat, intervalMs);
            
            startStopBtn.innerText = 'STOP';
            startStopBtn.classList.add('playing');
            isPlaying = true;
        }

        function stopMetronome() {
            clearInterval(timerID);
            window.speechSynthesis.cancel(); 
            chordDisplay.innerText = '-';
            chordDisplay.style.color = "#ffffff";
            renderChordDiagram(null);
            playingChord = '';
            if (micStream) { showDetection(null); updateScoreDisplay(); }
            for (let i = 0; i < beatsPerMeasure; i++) {
                document.getElementById(`dot-${i}`).classList.remove('active', 'active-accent', 'active-prep');
            }

            startStopBtn.innerText = 'START';
            startStopBtn.classList.remove('playing');
            isPlaying = false;
        }

        startStopBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopMetronome();
            } else {
                startMetronome();
            }
        });

        bpmInput.addEventListener('change', () => {
            if (isPlaying) {
                clearInterval(timerID);
                const bpm = parseInt(bpmInput.value);
                const intervalMs = (60 / bpm) * 1000;
                timerID = setInterval(triggerBeat, intervalMs);
            }
        });

        initializePreferences();

    </script>
</body>
</html>
